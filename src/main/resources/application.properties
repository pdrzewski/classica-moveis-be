spring.application.name=classicamoveis

# Configuração do MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/classica?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:classica_user}
spring.datasource.password=${DB_PASSWORD:classica_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.validity=${JWT_VALIDITY:86400}
app.cookie.secure=${COOKIE_SECURE   :false}